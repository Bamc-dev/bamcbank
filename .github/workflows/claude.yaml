name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Least privilege: read the code, write comments only. No contents:write, so Claude cannot push or merge.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    # Only trigger on @claude, and only for the repo owner/members so strangers cannot burn the token.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only tools: no Edit/Write/Bash, so the only output is a comment.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Grep,Glob"
